<!doctype html>
<html lang="en">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rep Log</title>
<meta name="description" content="A simple workout logger — track sets, reps, and weight, and watch your lifts trend up over time.">
<meta name="theme-color" content="#e64a1e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --surface-2: #ebe8e1;
    --surface-3: #e0dcd2;
    --ink: #1c1d1f;
    --ink-dim: #6b6d72;
    --ink-faint: #9a9c9f;
    --line: #d8d4cb;
    --accent: #e64a1e;
    --accent-ink: #fffaf5;
    --accent-soft: #e64a1e1a;
    --data-2: #2f5f92;
    --success: #2f8f56;
    --success-soft: #2f8f5622;
    --gold: #c8880a;
    --danger: #d64545;
    --shadow: 0 1px 2px rgba(20, 18, 14, 0.06), 0 8px 24px -12px rgba(20, 18, 14, 0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121316;
      --surface: #1c1e22;
      --surface-2: #24262b;
      --surface-3: #2c2f35;
      --ink: #f0efec;
      --ink-dim: #a7a9ae;
      --ink-faint: #74767c;
      --line: #34373d;
      --accent: #ff6a35;
      --accent-ink: #1a0d06;
      --accent-soft: #ff6a3526;
      --data-2: #6fa4e0;
      --success: #4fbb7e;
      --success-soft: #4fbb7e26;
      --gold: #ffc233;
      --danger: #ff6b6b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121316;
    --surface: #1c1e22;
    --surface-2: #24262b;
    --surface-3: #2c2f35;
    --ink: #f0efec;
    --ink-dim: #a7a9ae;
    --ink-faint: #74767c;
    --line: #34373d;
    --accent: #ff6a35;
    --accent-ink: #1a0d06;
    --accent-soft: #ff6a3526;
    --data-2: #6fa4e0;
    --success: #4fbb7e;
    --success-soft: #4fbb7e26;
    --gold: #ffc233;
    --danger: #ff6b6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; }
  h1, h2, h3, .display {
    font-family: "Bebas Neue", "Oswald", Impact, sans-serif;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .num { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  input { font-family: inherit; }

  #app {
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 0 12px;
    background: var(--bg);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand-mark {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--accent);
    display: inline-block;
    margin-bottom: 2px;
  }
  .brand h1 {
    font-size: 26px;
    margin: 0;
    line-height: 1;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    color: var(--ink-dim);
    flex: none;
    position: relative;
    overflow: hidden;
    padding: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn img { width: 100%; height: 100%; object-fit: cover; }
  .icon-btn.danger { color: var(--danger); }

  /* ---------- Tab content ---------- */
  .view { display: none; }
  .view.active { display: block; }
  .section-title {
    font-size: 13px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin: 0 0 10px;
  }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    display: flex;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .tabbar-inner {
    width: 100%;
    max-width: 640px;
    margin: 0 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 6px;
    gap: 4px;
  }
  .tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px 7px;
    border: none;
    background: transparent;
    border-radius: 13px;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  .tab-btn svg { width: 20px; height: 20px; }

  /* ---------- Cards / lists ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .muted { color: var(--ink-dim); }
  .faint { color: var(--ink-faint); }
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: var(--surface-2);
    color: var(--ink-dim);
  }

  /* ---------- Log: exercise picker ---------- */
  .search-input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
  }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .chip-row.equip { margin-top: 6px; }
  .chip {
    flex: none;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.small { padding: 4px 10px; font-size: 11px; }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ex-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .ex-item {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .ex-item-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 6px 13px 14px;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
  }
  .ex-item-main:active { background: var(--surface-2); }
  .ex-item .name { font-weight: 600; font-size: 14.5px; }
  .ex-item .meta { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .fav-btn {
    flex: none;
    width: 40px;
    height: 40px;
    margin-right: 4px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .fav-btn svg { width: 19px; height: 19px; }
  .fav-btn.active { color: var(--gold); }
  .fav-btn.active svg { fill: var(--gold); }
  .add-ex-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 13px;
    border-radius: 12px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--ink-dim);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    margin-top: 4px;
    width: 100%;
  }

  /* ---------- Repeat last workout ---------- */
  .repeat-card {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .repeat-card .info { flex: 1; min-width: 0; }
  .repeat-card .t { font-weight: 700; font-size: 13px; color: var(--ink); text-transform: uppercase; letter-spacing: 0.03em; }
  .repeat-card .d { font-size: 12.5px; color: var(--ink-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repeat-card button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  /* ---------- Workout in progress ---------- */
  .workout-header {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .workout-header .t { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink); }
  .workout-header .d { font-size: 12.5px; color: var(--ink-dim); margin-top: 3px; }
  .hist-ex-btn { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; }

  /* ---------- Set entry ---------- */
  .entry-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .back-btn {
    border: none;
    background: var(--surface-2);
    color: var(--ink);
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
  }
  .unit-toggle {
    display: flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .unit-toggle button {
    border: none;
    background: transparent;
    color: var(--ink-dim);
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .unit-toggle button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .suggest-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest-chip {
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .deload-notice {
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 10px;
    border-left: 3px solid var(--data-2);
  }

  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 700; }
  .num-input-wrap {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
  }
  .num-input-wrap button {
    border: none;
    background: var(--surface-2);
    color: var(--ink);
    width: 38px;
    height: 46px;
    font-size: 18px;
    cursor: pointer;
    flex: none;
  }
  .num-input-wrap input {
    flex: 1;
    border: none;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    font-family: "Space Mono", monospace;
    background: transparent;
    color: var(--ink);
    width: 0;
    min-width: 0;
    padding: 0 2px;
  }
  .num-input-wrap input:focus { outline: none; }

  .plate-toggle, .note-toggle {
    background: none;
    border: none;
    color: var(--data-2);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    text-align: left;
  }
  .plate-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .plate-chip {
    background: var(--surface-3);
    color: var(--ink);
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 8px;
  }
  .note-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
  }

  .rest-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .rest-bar .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 700; }
  .rest-bar .time { font-family: "Space Mono", monospace; font-weight: 700; font-size: 16px; min-width: 42px; }
  .rest-bar button {
    border: none;
    background: var(--surface-3);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .rest-bar .skip { margin-left: auto; }

  .add-set-btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .set-list { display: flex; flex-direction: column; gap: 6px; }
  .set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 10px;
  }
  .set-row .idx {
    font-family: "Space Mono", monospace;
    font-size: 11px;
    color: var(--ink-faint);
    width: 18px;
  }
  .set-row .val {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 14.5px;
  }
  .set-row .x { color: var(--ink-faint); font-size: 12px; }
  .set-row .rm {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    width: 26px;
    height: 26px;
    flex: none;
  }
  .set-note { font-size: 11px; color: var(--ink-faint); font-style: italic; margin: -4px 0 2px 4px; }
  .save-workout-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    width: 100%;
  }
  .save-workout-btn:disabled { opacity: 0.4; cursor: default; }

  /* ---------- History ---------- */
  .day-group { display: flex; flex-direction: column; gap: 8px; }
  .day-heading {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 18px;
    margin-bottom: 2px;
  }
  .day-heading:first-child { margin-top: 0; }
  .day-heading .d { font-size: 15px; font-weight: 700; }
  .day-heading .n { font-size: 12px; color: var(--ink-faint); }
  .hist-ex {
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .hist-ex .name { font-weight: 600; font-size: 14px; }
  .hist-set-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .hist-set-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--surface-2);
    border-radius: 8px;
    cursor: pointer;
  }
  .hist-set-row .val { font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; flex: 1; }
  .hist-set-row .note-tag { font-size: 11px; color: var(--ink-faint); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-edit-input {
    width: 54px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    text-align: center;
    padding: 5px 2px;
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 13px;
  }
  .hist-edit-btn {
    border: none;
    background: var(--surface-3);
    color: var(--ink);
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Progress ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .stat-tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 700; }
  .stat-tile .value { font-family: "Space Mono", monospace; font-size: 26px; font-weight: 700; margin-top: 4px; }
  .stat-tile .value .unit { font-size: 14px; color: var(--ink-dim); font-weight: 500; margin-left: 3px; }
  .chart-wrap { position: relative; margin-top: 8px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--surface-3);
    color: var(--ink-dim);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .heatmap-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .heatmap-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2); }
  .heatmap-legend { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--ink-faint); }
  .heatmap-legend .heatmap-cell { width: 9px; height: 9px; }

  .vol-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .vol-bar-label { width: 72px; flex: none; color: var(--ink-dim); font-weight: 600; }
  .vol-bar-track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .vol-bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.3s ease; }
  .vol-bar-value { width: 48px; text-align: right; flex: none; color: var(--ink-faint); font-family: "Space Mono", monospace; }

  .bw-input-row { display: flex; gap: 8px; align-items: stretch; }
  .bw-input-row .num-input-wrap { max-width: 130px; }
  .bw-log-btn {
    flex: none;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-dim);
  }
  .empty svg { width: 40px; height: 40px; color: var(--ink-faint); margin-bottom: 10px; }
  .empty .t { font-weight: 700; color: var(--ink); margin-bottom: 4px; }

  /* ---------- Menu sheet ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 7, 0.45);
    z-index: 40;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet {
    background: var(--surface);
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    box-shadow: var(--shadow);
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 6px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    background: transparent;

  function uid() {

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function isoDaysAgo(days) {
    var d = new Date();
    d.setDate(d.getDate() - days);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function fmtDateHeading(iso) {
    var today = todayISO();
    var yestISO = isoDaysAgo(1);
    if (iso === today) return "Today";
    if (iso === yestISO) return "Yesterday";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

    });
  }

  function toast(msg) {

  function celebrate(names) {

    el.textContent = "New PR — " + label;
    el.classList.add("show", "pr");

    spawnConfetti();

  function spawnConfetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#e64a1e", "#2f8f56", "#2f5f92", "#c8880a"];
    for (var i = 0; i < 18; i++) {
      (function () {
        var d = document.createElement("div");
        d.className = "confetti-piece";
        var angle = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 100;
        d.style.setProperty("--dx", (Math.cos(angle) * dist).toFixed(0) + "px");
        d.style.setProperty("--dy", (Math.sin(angle) * dist - 40).toFixed(0) + "px");
        d.style.setProperty("--rot", (Math.random() * 360).toFixed(0) + "deg");
        d.style.background = colors[i % colors.length];
        document.body.appendChild(d);
        setTimeout(function () { d.remove(); }, 950);
      })();
    }
  }

  function playBeep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
      o.start();
      o.stop(ctx.currentTime + 0.45);
    } catch (e) {}
  }

  function allExercises() {

  function exerciseById(id) {
    var list = allExercises();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];

  // ---------------------------------------------------------------
  // Derived data helpers
  // ---------------------------------------------------------------
  function estOneRepMax(weight, reps) {
    if (!reps || reps <= 1) return weight;
    return weight * (1 + reps / 30);
  }

  function estForSet(s) {
    var w = s.unit === "lb" ? s.weight * 0.453592 : s.weight;
    return estOneRepMax(w, s.reps);
  }

  function groupByDay(sets) {
    var byDate = {};
    sets.forEach(function (s) {
      (byDate[s.date] = byDate[s.date] || []).push(s);
    });
    var dates = Object.keys(byDate).sort().reverse();
    return dates.map(function (date) {
      var daySets = byDate[date];
      var byExercise = {};
      var order = [];
      daySets.forEach(function (s) {
        if (!byExercise[s.exerciseId]) { byExercise[s.exerciseId] = { name: s.exerciseName, sets: [] }; order.push(s.exerciseId); }
        byExercise[s.exerciseId].sets.push(s);
      });
      return { date: date, exercises: byExercise, order: order };
    });
  }

  function exercisesLogged() {
    var seen = {};
    var out = [];
    state.allSets.forEach(function (s) {
      if (!seen[s.exerciseId]) {
        seen[s.exerciseId] = true;
        out.push({ id: s.exerciseId, name: s.exerciseName });
      }
    });
    return out;
  }

  function suggestNext(last) {
    if (!last) return null;
    var stepUp = last.unit === "lb" ? 5 : 2.5;
    if (last.reps >= 10) return { weight: last.weight + stepUp, reps: 8 };
    return { weight: last.weight, reps: last.reps + 1 };
  }

  function platesForWeight(total, unit) {
    var bar = BAR_WEIGHT[unit] || BAR_WEIGHT.kg;
    if (!(total > bar)) return null;
    var perSide = (total - bar) / 2;
    var avail = PLATES[unit] || PLATES.kg;
    var result = [];
    var remaining = perSide;
    for (var i = 0; i < avail.length; i++) {
      var p = avail[i];
      var guard = 0;
      while (remaining + 1e-6 >= p && guard < 20) { result.push(p); remaining -= p; guard++; }
    }
    return { perSide: perSide, plates: result, remainder: remaining > 0.05 ? remaining : 0, bar: bar };
  }

  function seriesForExercise(exerciseId) {
    var sets = state.allSets.filter(function (s) { return s.exerciseId === exerciseId; });
    var byDate = {};
    sets.forEach(function (s) {
      var est = estForSet(s);
      if (!byDate[s.date] || est > byDate[s.date].est1rm) {
        byDate[s.date] = { date: s.date, topWeight: s.weight, unit: s.unit, est1rm: s.unit === "lb" ? est / 0.453592 : est };
      }
    });
    return Object.keys(byDate).sort().map(function (d) { return byDate[d]; });
  }

  function checkDeload(exId) {
    var series = seriesForExercise(exId);
    var n = series.length;
    if (n < 3) return false;
    return series[n - 1].est1rm < series[n - 2].est1rm && series[n - 2].est1rm < series[n - 3].est1rm;
  }

  function volumeByCategoryThisWeek() {
    var cutoff = isoDaysAgo(6);
    var totals = {};
    CATEGORIES.forEach(function (c) { totals[c] = 0; });
    state.allSets.filter(function (s) { return s.date >= cutoff; }).forEach(function (s) {
      var ex = exerciseById(s.exerciseId);
      var cat = ex ? ex.category : null;
      if (!cat || totals[cat] === undefined) return;
      var w = s.unit === "lb" ? s.weight * 0.453592 : s.weight;
      totals[cat] += w * s.reps;
    });
    return CATEGORIES.map(function (c) { return { category: c, volume: totals[c] }; });
  }

    return (

        '<button class="icon-btn" id="menu-btn" type="button" aria-label="Menu">' + avatarHtml + "</button>" +
      "</div>"

  function renderTabbar() {
    function tab(id, label, path) {

        "</button>"

    }
    return (
      '<div class="tabbar"><div class="tabbar-inner">' +
        tab("log", "Log", '<path d="M12 5v14M5 12h14"/>') +
        tab("history", "History", '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>') +
        tab("progress", "Progress", '<path d="M3 3v18h18"/><path d="M18.7 8 12.5 14.2 9 10.7 4 15.7"/>') +
      "</div></div>"
    );
  }

  function renderMenuSheet() {
    var authSection;
    var googleIcon = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.4 4.4-4.6 5.8l6.3 5.3C40.5 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>';
    if (!state.cloudAvailable) {
      authSection =
        '<div class="section-title">Backup & sync</div>' +
        '<div class="faint" style="font-size:12.5px;margin:-4px 0 12px">Cloud backup isn\'t configured for this site yet — sets stay on this device.</div>';
    } else if (state.user) {
      authSection =
        '<div class="section-title">Backup & sync</div>' +
        '<div class="user-row" style="display:flex;align-items:center;gap:12px;padding:8px 6px">' +
          (state.user.photo ? '<img src="' + escapeHtml(state.user.photo) + '" alt="" referrerpolicy="no-referrer" style="width:38px;height:38px;border-radius:50%">' : '<div style="width:38px;height:38px;border-radius:50%;background:var(--surface-3)"></div>') +
          '<div><div style="font-weight:700;font-size:14.5px">' + escapeHtml(state.user.name) + '</div><div class="faint" style="font-size:12px">Synced to your account</div></div>' +
        "</div>" +
        '<button class="menu-row" id="signout-btn" type="button">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>' +
          '<span>Sign out<span class="desc">Switch back to local-only on this device</span></span>' +
        "</button>" +
        '<div class="menu-sep"></div>';
    } else {
      authSection =
        '<div class="section-title">Backup & sync</div>' +
        '<button class="menu-row" id="signin-btn" type="button">' +
          '<span style="width:20px;height:20px;display:inline-flex;flex:none">' + googleIcon + "</span>" +
          '<span>Sign in with Google<span class="desc">Back up your sets and sync across your devices</span></span>' +
        "</button>" +
        '<div class="menu-sep"></div>';
    }

    var dataDesc = state.user
      ? "Backed up to your account. You can still export a local copy any time."
      : "Saved only on this device/browser. Back it up so a new phone or a cleared cache can’t lose your history.";

    return (
      '<div class="sheet-backdrop" id="menu-backdrop">' +
        '<div class="sheet">' +
          '<div class="sheet-handle"></div>' +
          authSection +
          '<div class="section-title">Your data</div>' +
          '<div class="faint" style="font-size:12.5px;margin:-4px 0 10px">' + dataDesc + "</div>" +
          '<button class="menu-row" id="export-btn" type="button">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>' +
            '<span>Export backup<span class="desc">Download all sets as a JSON file</span></span>' +
          "</button>" +
          '<button class="menu-row" id="import-btn" type="button">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>' +
            '<span>Import backup<span class="desc">Merge in sets from a backup file</span></span>' +
          "</button>" +
          '<div class="menu-sep"></div>' +
          '<button class="menu-row danger" id="clear-btn" type="button">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>' +
            '<span>Clear all data<span class="desc">Erase every logged set' + (state.user ? " from your account" : " on this device") + '</span></span>' +
          "</button>" +
        "</div>" +
      "</div>"
    );
  }

  // ---- Log tab ----
  function renderLog() {
    if (state.activeExercise) return renderLogEntry();
    if (state.activeWorkout && state.workoutView === "workout") return renderWorkoutActive();
    return renderExercisePicker();
  }

  function renderExItem(ex) {
    var isFav = state.favoriteIds.indexOf(ex.id) !== -1;
    return (
      '<div class="ex-item">' +
        '<button class="ex-item-main" data-exercise="' + escapeHtml(ex.id) + '" type="button">' +
          '<span><span class="name">' + escapeHtml(ex.name) + '</span><div class="meta">' + escapeHtml(ex.category) + (ex.equipment ? " · " + escapeHtml(ex.equipment) : "") + "</div></span>" +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>' +
        "</button>" +
        '<button class="fav-btn' + (isFav ? " active" : "") + '" data-toggle-fav="' + escapeHtml(ex.id) + '" type="button" aria-label="Favorite">' +
          '<svg viewBox="0 0 24 24" fill="' + (isFav ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.7 6.2.6-4.7 4.2 1.4 6.1L12 17l-5.5 3.1 1.4-6.1-4.7-4.2 6.2-.6z"/></svg>' +
        "</button>" +
      "</div>"
    );
  }

  function renderExercisePicker() {
    var q = state.exerciseSearch.trim().toLowerCase();
    var list = allExercises().filter(function (ex) {
      var okCat = state.exerciseFilter === "All" || ex.category === state.exerciseFilter;
      var okEquip = state.equipmentFilter === "All" || ex.equipment === state.equipmentFilter;
      var okQ = !q || ex.name.toLowerCase().indexOf(q) !== -1;
      return okCat && okEquip && okQ;
    });

    var catChips = ["All"].concat(CATEGORIES).map(function (c) {
      return '<button class="chip' + (state.exerciseFilter === c ? " active" : "") + '" data-filter="' + escapeHtml(c) + '" type="button">' + escapeHtml(c) + "</button>";
    }).join("");
    var equipChips = ["All"].concat(EQUIPMENT).map(function (c) {
      return '<button class="chip small' + (state.equipmentFilter === c ? " active" : "") + '" data-equip="' + escapeHtml(c) + '" type="button">' + escapeHtml(c) + "</button>";
    }).join("");

    var items = list.map(renderExItem).join("");
    if (!items) items = '<div class="empty"><div class="t">No matches</div><div>Try a different search or filter, or add it as a custom exercise.</div></div>';

    var favExs = allExercises().filter(function (ex) {
      if (state.favoriteIds.indexOf(ex.id) === -1) return false;
      var okCat = state.exerciseFilter === "All" || ex.category === state.exerciseFilter;
      var okEquip = state.equipmentFilter === "All" || ex.equipment === state.equipmentFilter;
      return okCat && okEquip;
    });
    var favHtml = (!q && favExs.length)
      ? '<div class="section-title" style="margin-top:16px">Favorites</div><div class="ex-list">' + favExs.map(renderExItem).join("") + "</div>"
      : "";

    var repeatHtml = "";
    if (!state.activeWorkout) {
      var groups = groupByDay(state.allSets);
      if (groups.length) {
        var g = groups[0];
        var names = g.order.map(function (id) { return g.exercises[id].name; }).join(", ");
        repeatHtml =
          '<div class="repeat-card">' +
            '<div class="info"><div class="t">Repeat ' + escapeHtml(fmtDateHeading(g.date)) + "'s workout</div><div class=\"d\">" + escapeHtml(names) + "</div></div>" +
            '<button id="repeat-btn" type="button">Repeat</button>' +
          "</div>";
      }
    }

    return (
      repeatHtml +
      '<div class="section-title">What are you training?</div>' +
      '<input class="search-input" id="ex-search" type="search" placeholder="Search exercises…" value="' + escapeHtml(state.exerciseSearch) + '">' +
      '<div class="chip-row" style="margin-top:10px">' + catChips + "</div>" +
      '<div class="chip-row equip">' + equipChips + "</div>" +
      favHtml +
      '<div class="section-title" style="margin-top:16px">All exercises</div>' +
      '<div class="ex-list" style="margin-top:0">' + items + "</div>" +
      '<button class="add-ex-btn" id="add-ex-btn" type="button">+ Add a custom exercise</button>'
    );
  }

  function setsForWorkout(workoutId) {
    return state.allSets.filter(function (s) { return s.workoutId === workoutId; });
  }

  function renderWorkoutActive() {
    var w = state.activeWorkout;
    var wSets = setsForWorkout(w.id);
    var groups = {}, order = [];
    wSets.forEach(function (s) {
      if (!groups[s.exerciseId]) { groups[s.exerciseId] = { name: s.exerciseName, sets: [] }; order.push(s.exerciseId); }
      groups[s.exerciseId].sets.push(s);
    });
    var elapsedMin = Math.max(0, Math.round((Date.now() - w.startedAt) / 60000));

    var exCards = order.map(function (exId) {
      var g = groups[exId];
      var setsStr = g.sets.map(function (s) { return s.weight + s.unit + "×" + s.reps; }).join(", ");
      return (
        '<button class="hist-ex hist-ex-btn" data-resume-exercise="' + escapeHtml(exId) + '" type="button">' +
          '<div class="name">' + escapeHtml(g.name) + '</div><div class="sets" style="font-family:\'Space Mono\',monospace;font-size:12.5px;color:var(--ink-dim);margin-top:4px">' + escapeHtml(setsStr) + "</div>" +
        "</button>"
      );
    }).join("");

    return (
      '<div class="workout-header row between">' +
        '<div><div class="t">Workout in progress</div><div class="d">' + elapsedMin + " min · " + wSets.length + (wSets.length === 1 ? " set" : " sets") + "</div></div>" +
        '<button class="icon-btn danger" id="cancel-workout-btn" type="button" aria-label="Discard workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>' +
      "</div>" +
      (exCards ? '<div class="stack" style="gap:8px">' + exCards + "</div>" : '<div class="faint" style="padding:6px 2px">No exercises logged yet.</div>') +
      '<button class="add-ex-btn" id="add-exercise-btn" type="button" style="margin-top:12px">+ Add exercise</button>' +
      '<button class="save-workout-btn" id="finish-workout-btn" type="button" style="margin-top:10px">Finish workout</button>'
    );
  }

  function renderLogEntry() {
    var ex = state.activeExercise;
    var lastForEx = state.allSets.filter(function (s) { return s.exerciseId === ex.id; })[0];
    var suggestion = suggestNext(lastForEx);
    var deload = checkDeload(ex.id);

    var setsHtml = state.draftSets.map(function (s, i) {
      var row =
        '<div class="set-row">' +
          '<span class="idx num">' + (i + 1) + "</span>" +
          '<span class="val num">' + s.weight + " " + s.unit + '</span>' +
          '<span class="x">×</span>' +
          '<span class="val num">' + s.reps + " reps</span>" +
          '<button class="rm" data-remove-set="' + i + '" type="button" aria-label="Remove set">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
          "</button>" +
        "</div>";
      var noteRow = s.note ? '<div class="set-note">“' + escapeHtml(s.note) + '”</div>' : "";
      return row + noteRow;
    }).join("");

    var showPlateOption = ex.equipment === "Barbell";
    var wNum = parseFloat(state.draftWeight);
    var plateInfo = showPlateOption && wNum > 0 ? platesForWeight(wNum, state.draftUnit) : null;
    var plateHtml = "";
    if (showPlateOption) {
      plateHtml = '<button class="plate-toggle" id="plate-toggle" type="button">' + (state.showPlates ? "Hide plates" : "Show plates per side") + "</button>";
      if (state.showPlates) {
        if (plateInfo) {
          plateHtml += '<div class="plate-row">' + plateInfo.plates.map(function (p) { return '<span class="plate-chip">' + p + "</span>"; }).join("") +
            (plateInfo.remainder ? '<span class="plate-chip">+' + plateInfo.remainder.toFixed(2).replace(/\.?0+$/, "") + "</span>" : "") + "</div>";
        } else {
          plateHtml += '<div class="faint" style="font-size:12px">Enter a weight above the bar (' + BAR_WEIGHT[state.draftUnit] + state.draftUnit + ") to see plates</div>";
        }
      }
    }

    var noteHtml = '<button class="note-toggle" id="note-toggle" type="button">' + (state.showNoteInput ? "Hide note" : "+ Add note") + "</button>" +
      (state.showNoteInput ? '<input class="note-input" id="note-input" type="text" placeholder="e.g. felt heavy, shoulder tweak" value="' + escapeHtml(state.draftNote) + '">' : "");

    return (
      '<div class="stack">' +
        '<div class="entry-header">' +
          '<button class="back-btn" id="log-back" type="button" aria-label="Back">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>' +
          "</button>" +
          '<h2 style="margin:0;font-size:22px;flex:1">' + escapeHtml(ex.name) + "</h2>" +
          '<span class="pill">' + escapeHtml(ex.category) + "</span>" +
        "</div>" +
        (lastForEx ? '<div class="faint" style="font-size:12.5px">Last time: <span class="num">' + lastForEx.weight + " " + lastForEx.unit + " × " + lastForEx.reps + "</span> · " + fmtDateHeading(lastForEx.date) + "</div>" : "") +
        (deload ? '<div class="deload-notice">Your top set has dropped two sessions in a row — consider a lighter session today.</div>' : "") +
        (suggestion ? '<div class="suggest-row"><button class="suggest-chip" id="suggest-chip" data-w="' + suggestion.weight + '" data-r="' + suggestion.reps + '" type="button">Try ' + suggestion.weight + " " + lastForEx.unit + " × " + suggestion.reps + "</button></div>" : "") +
        '<div class="card stack">' +
          '<div class="row between">' +
            '<span class="section-title" style="margin:0">Add a set</span>' +
            '<div class="unit-toggle">' +
              '<button data-unit="kg" class="' + (state.draftUnit === "kg" ? "active" : "") + '" type="button">kg</button>' +
              '<button data-unit="lb" class="' + (state.draftUnit === "lb" ? "active" : "") + '" type="button">lb</button>' +
            "</div>" +
          "</div>" +
          '<div class="input-grid">' +
            '<div class="field"><label for="weight-input">Weight</label>' +
              '<div class="num-input-wrap">' +
                '<button data-step="weight" data-dir="-1" type="button" aria-label="Decrease weight">−</button>' +
                '<input id="weight-input" inputmode="decimal" type="number" min="0" step="0.5" value="' + escapeHtml(state.draftWeight) + '">' +
                '<button data-step="weight" data-dir="1" type="button" aria-label="Increase weight">+</button>' +
              "</div>" +
            "</div>" +
            '<div class="field"><label for="reps-input">Reps</label>' +
              '<div class="num-input-wrap">' +
                '<button data-step="reps" data-dir="-1" type="button" aria-label="Decrease reps">−</button>' +
                '<input id="reps-input" inputmode="numeric" type="number" min="0" step="1" value="' + escapeHtml(state.draftReps) + '">' +
                '<button data-step="reps" data-dir="1" type="button" aria-label="Increase reps">+</button>' +
              "</div>" +
            "</div>" +
          "</div>" +
          (showPlateOption ? plateHtml : "") +
          noteHtml +
          '<button class="add-set-btn" id="add-set-btn" type="button">Add set</button>' +
        "</div>" +
        (state.rest.active ? renderRestBar() : "") +
        (setsHtml ? '<div class="section-title">This exercise</div><div class="set-list">' + setsHtml + "</div>" : "") +
        '<button class="save-workout-btn" id="save-workout-btn" type="button"' + (state.draftSets.length ? "" : " disabled") + ">Add " + state.draftSets.length + (state.draftSets.length === 1 ? " set" : " sets") + " to workout</button>" +
      "</div>"
    );
  }

  function renderRestBar() {
    var mm = Math.floor(state.rest.remaining / 60), ss = state.rest.remaining % 60;
    var timeStr = mm + ":" + String(ss).padStart(2, "0");
    return (
      '<div class="rest-bar" id="rest-bar">' +
        '<span class="label">Rest</span>' +
        '<span class="time num" id="rest-time">' + timeStr + "</span>" +
        '<button data-rest-adj="-15" type="button">−15s</button>' +
        '<button data-rest-adj="15" type="button">+15s</button>' +
        '<button class="skip" data-rest-stop type="button">Skip</button>' +
      "</div>"
    );
  }

  // ---- History tab ----
  function renderHistSetRow(s) {
    if (state.editingSetId === s.id) {
      return (
        '<div class="hist-set-row" style="cursor:default">' +
          '<input class="hist-edit-input" data-edit-field="weight" type="number" step="0.5" value="' + escapeHtml(state.editDraft.weight) + '">' +
          '<span class="faint" style="font-size:11px">' + s.unit + "</span>" +
          '<span class="x">×</span>' +
          '<input class="hist-edit-input" data-edit-field="reps" type="number" step="1" value="' + escapeHtml(state.editDraft.reps) + '">' +
          '<span class="faint" style="font-size:11px">reps</span>' +
          '<button class="hist-edit-btn" data-save-edit="' + s.id + '" type="button">Save</button>' +
          '<button class="hist-edit-btn" data-cancel-edit type="button">Cancel</button>' +
        "</div>"
      );
    }
    return (
      '<div class="hist-set-row" data-edit-set="' + s.id + '">' +
        '<span class="val">' + s.weight + s.unit + " × " + s.reps + "</span>" +
        (s.note ? '<span class="note-tag">“' + escapeHtml(s.note) + '”</span>' : "") +
        '<button class="rm" data-delete-set="' + s.id + '" type="button" aria-label="Delete set">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
        "</button>" +
      "</div>"
    );
  }

  function renderHistory() {
    var sets = state.allSets;
    if (!sets.length) {
      return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><div class="t">No workouts yet</div><div>Log a workout and it’ll show up here.</div></div>';
    }
    var groups = groupByDay(sets);
    return groups.map(function (g) {
      var mins = state.workouts.filter(function (w) { return w.date === g.date; })
        .reduce(function (sum, w) { return sum + Math.max(0, Math.round((w.finishedAt - w.startedAt) / 60000)); }, 0);
      var exBlocks = g.order.map(function (exId) {
        var e = g.exercises[exId];
        var rows = e.sets.map(renderHistSetRow).join("");
        return '<div class="hist-ex"><div class="name">' + escapeHtml(e.name) + '</div><div class="hist-set-list">' + rows + "</div></div>";
      }).join("");
      return (
        '<div class="day-heading"><span class="d">' + fmtDateHeading(g.date) + '</span><span class="n">' + g.order.length + (g.order.length === 1 ? " exercise" : " exercises") + (mins ? " · " + mins + " min" : "") + "</span></div>" +
        '<div class="stack" style="gap:6px">' + exBlocks + "</div>"
      );
    }).join("");
  }

  // ---- Progress tab ----
  function renderProgress() {
    var logged = exercisesLogged();
    var isExample = logged.length === 0;
    var options = logged;
    if (isExample) {
      options = [{ id: "__example__", name: "Bench Press" }];
    }
    if (!state.progressExerciseId || !options.some(function (o) { return o.id === state.progressExerciseId; })) {
      state.progressExerciseId = options[0].id;
    }

    var chips = options.map(function (o) {
      return '<button class="chip' + (state.progressExerciseId === o.id ? " active" : "") + '" data-progress-ex="' + escapeHtml(o.id) + '" type="button">' + escapeHtml(o.name) + "</button>";
    }).join("");

    var data = isExample ? exampleSeries() : seriesForExercise(state.progressExerciseId);
    var last = data[data.length - 1];
    var pr = data.reduce(function (a, b) { return b.est1rm > a.est1rm ? b : a; }, data[0]);

    var lastBw = state.bodyweights[state.bodyweights.length - 1];

    return (
      '<div class="section-title">Progress</div>' +
      '<div class="chip-row">' + chips + "</div>" +
      '<div class="stat-grid" style="margin-top:14px">' +
        '<div class="stat-tile"><div class="label">Last logged</div><div class="value">' + (last ? Math.round(last.topWeight) : "—") + '<span class="unit">' + (last ? last.unit : "") + "</span></div></div>" +
        '<div class="stat-tile"><div class="label">Est. 1RM (best)</div><div class="value">' + (pr ? Math.round(pr.est1rm) : "—") + '<span class="unit">' + (pr ? pr.unit : "") + "</span></div></div>" +
      "</div>" +
      '<div class="card" style="margin-top:12px">' +
        '<div class="row between"><span class="section-title" style="margin:0">Top set over time</span></div>' +
        '<div class="chart-wrap" id="chart-wrap">' +
          (isExample ? '<span class="chart-badge">Example</span>' : "") +
        "</div>" +
        (isExample ? '<div class="faint" style="font-size:12px;margin-top:8px">Log a few sessions of an exercise to see your own trend here.</div>' : "") +
      "</div>" +

        '<div class="section-title">Consistency</div>' +
        renderHeatmap() +

        '<div class="row between"><span class="section-title" style="margin:0">Body weight</span>' +
          '<div class="unit-toggle"><button data-bw-unit="kg" class="' + (state.bwUnit === "kg" ? "active" : "") + '" type="button">kg</button><button data-bw-unit="lb" class="' + (state.bwUnit === "lb" ? "active" : "") + '" type="button">lb</button></div>' +
        "</div>" +

          '<div class="num-input-wrap"><input id="bw-input" inputmode="decimal" type="number" min="0" step="0.1" value="' + escapeHtml(state.bwWeight) + '" placeholder="' + (lastBw ? lastBw.weight : "0") + '"></div>' +

    );

  function renderVolumeBars() {
    var rows = volumeByCategoryThisWeek();
    var max = Math.max.apply(null, rows.map(function (r) { return r.volume; }).concat([1]));
    return '<div class="stack" style="gap:8px">' + rows.map(function (r) {
      var pct = max > 0 ? Math.round((r.volume / max) * 100) : 0;
      return '<div class="vol-bar-row"><span class="vol-bar-label">' + r.category + '</span><div class="vol-bar-track"><div class="vol-bar-fill" style="width:' + pct + '%"></div></div><span class="vol-bar-value">' + Math.round(r.volume) + "</span></div>";
    }).join("") + "</div>";
  }

  function renderHeatmap() {
    var weeks = 14;
    var counts = {};
    state.allSets.forEach(function (s) { counts[s.date] = (counts[s.date] || 0) + 1; });
    var cells = [];
    for (var i = weeks * 7 - 1; i >= 0; i--) cells.push({ date: isoDaysAgo(i), count: counts[isoDaysAgo(i)] || 0 });
    var firstDow = new Date(cells[0].date + "T00:00:00").getDay();
    var padded = [];
    for (var p = 0; p < firstDow; p++) padded.push(null);
    padded = padded.concat(cells);
    var cellsHtml = padded.map(function (c) {
      if (!c) return '<div class="heatmap-cell" style="opacity:0"></div>';
      var level = c.count === 0 ? 0 : c.count === 1 ? 1 : c.count <= 3 ? 2 : 3;
      var bg = level === 0 ? "var(--surface-2)" : level === 1 ? "var(--accent-soft)" : level === 2 ? "var(--accent)" : "var(--success)";
      return '<div class="heatmap-cell" style="background:' + bg + '" title="' + c.date + ": " + c.count + (c.count === 1 ? " set" : " sets") + '"></div>';
    }).join("");
    return (
      '<div class="heatmap-grid">' + cellsHtml + "</div>" +
      '<div class="heatmap-legend">Less' +
        '<span class="heatmap-cell" style="background:var(--surface-2)"></span>' +
        '<span class="heatmap-cell" style="background:var(--accent-soft)"></span>' +
        '<span class="heatmap-cell" style="background:var(--accent)"></span>' +
        '<span class="heatmap-cell" style="background:var(--success)"></span>' +
      "More</div>"
    );
  }

  function exampleSeries() {
    var daysAgoList = [21, 17, 14, 10, 7, 3, 0];
    return daysAgoList.map(function (daysAgo, i) {
      var w = 60 + i * 3.5;
      return { date: isoDaysAgo(daysAgo), topWeight: w, unit: "kg", est1rm: estOneRepMax(w, 6) };
    });
  }

  function drawLineChart(wrapId, data, opts) {
    var wrap = document.getElementById(wrapId);
    if (!wrap) return;
    opts = opts || {};
    var badge = opts.badge || "";
    var valueKey = opts.valueKey || "value";
    var unitOf = opts.unitOf || function () { return ""; };
    var tooltipOf = opts.tooltipOf || function (d) { return String(d[valueKey]); };

    if (!data || data.length < 2) {
      wrap.innerHTML = badge + '<div class="empty" style="padding:20px 10px"><div class="t">' + (data && data.length === 1 ? "One entry logged" : "Not enough data yet") + "</div><div>" + (opts.emptyHint || "Log again to see a trend line.") + "</div></div>";
      return;
    }

    var W = 560, H = 170, padL = 36, padR = 14, padT = 16, padB = 24;
    var values = data.map(function (d) { return d[valueKey]; });
    var minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values);
    if (minV === maxV) { minV -= 5; maxV += 5; }
    var span = maxV - minV;
    minV -= span * 0.12; maxV += span * 0.12;

    function x(i) { return padL + (i / (data.length - 1)) * (W - padL - padR); }
    function y(v) { return padT + (1 - (v - minV) / (maxV - minV)) * (H - padT - padB); }

    var ticks = 3, gridLines = "";
    for (var t = 0; t <= ticks; t++) {
      var v = minV + (maxV - minV) * (t / ticks);
      var yy = y(v);
      gridLines += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>';
      gridLines += '<text x="0" y="' + (yy + 4) + '" font-size="10" font-family="Space Mono, monospace" fill="var(--ink-faint)">' + Math.round(v) + "</text>";
    }

    var linePath = data.map(function (d, i) { return (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(d[valueKey]).toFixed(1); }).join(" ");
    var areaPath = linePath + " L" + x(data.length - 1).toFixed(1) + "," + (H - padB) + " L" + x(0).toFixed(1) + "," + (H - padB) + " Z";

    var lastIdx = data.length - 1;
    var points = data.map(function (d, i) {
      var cx = x(i), cy = y(d[valueKey]);
      var isLast = i === lastIdx;
      var r = isLast ? 5 : 3;
      var label = "";
      if (isLast) {
        var lx = Math.min(Math.max(cx, padL + 24), W - padR - 24);
        label = '<text x="' + lx + '" y="' + (cy - 12) + '" font-size="11" font-weight="700" font-family="Space Mono, monospace" text-anchor="middle" fill="var(--ink)">' + Math.round(d[valueKey]) + unitOf(d) + "</text>";
      }
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>' + tooltipOf(d) + "</title></circle>" + label;
    }).join("");

    wrap.innerHTML = badge +
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img">' +
        '<defs><linearGradient id="' + wrapId + '-fill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/>' +
          '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
        "</linearGradient></defs>" +
        gridLines +
        '<path d="' + areaPath + '" fill="url(#' + wrapId + '-fill)"/>' +
        '<path d="' + linePath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
        points +
      "</svg>";
  }

  function drawProgressChart() {
    var logged = exercisesLogged();
    var isExample = logged.length === 0;
    var data = isExample ? exampleSeries() : seriesForExercise(state.progressExerciseId);
    drawLineChart("chart-wrap", data, {
      badge: isExample ? '<span class="chart-badge">Example</span>' : "",
      valueKey: "est1rm",
      unitOf: function (d) { return d.unit; },
      tooltipOf: function (d) { return fmtDateHeading(d.date) + ": " + Math.round(d.topWeight) + d.unit + " top set (est 1RM " + Math.round(d.est1rm) + d.unit + ")"; },
      emptyHint: "Log this exercise again to see a trend line."
    });
  }

  function bodyweightSeriesKg() {
    return state.bodyweights.map(function (b) {
      return { date: b.date, kg: b.unit === "lb" ? b.weight * 0.453592 : b.weight };
    });
  }

  function drawBodyweightChart() {
    var wrap = document.getElementById("bw-chart-wrap");
    if (!wrap) return;
    var data = bodyweightSeriesKg();
    drawLineChart("bw-chart-wrap", data, {
      valueKey: "kg",
      unitOf: function () { return "kg"; },

      emptyHint: "Log your weight a few times to see a trend line."
