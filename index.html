  // ---------------------------------------------------------------
  // Weekly recap (downloadable image)
  // ---------------------------------------------------------------
  function computeWeeklyRecap() {
    var cutoffISO = isoDaysAgo(6);
    var weekSets = state.allSets.filter(function (s) { return s.date >= cutoffISO; });
    var volumeKg = 0;
    weekSets.forEach(function (s) { var w = s.unit === "lb" ? s.weight * 0.453592 : s.weight; volumeKg += w * s.reps; });
    var sessions = {};
    weekSets.forEach(function (s) { sessions[s.date] = true; });

    var bestBefore = {};
    state.allSets.forEach(function (s) {
      if (s.date < cutoffISO) {
        var e = estForSet(s);
        if (!bestBefore[s.exerciseId] || e > bestBefore[s.exerciseId]) bestBefore[s.exerciseId] = e;
      }
    });
    var prCount = 0;
    weekSets.slice().sort(function (a, b) { return a.createdAt - b.createdAt; }).forEach(function (s) {
      var e = estForSet(s);
      if (bestBefore[s.exerciseId] === undefined || e > bestBefore[s.exerciseId] + 0.001) {
        if (bestBefore[s.exerciseId] !== undefined) prCount++;
        bestBefore[s.exerciseId] = e;
      }
    });

    return { volumeKg: volumeKg, sessions: Object.keys(sessions).length, prCount: prCount, from: cutoffISO, to: todayISO() };
  }

  function downloadWeeklyRecap() {
    var data = computeWeeklyRecap();
    var canvas = document.createElement("canvas");
    canvas.width = 800; canvas.height = 900;
    var ctx = canvas.getContext("2d");

    ctx.fillStyle = "#121316"; ctx.fillRect(0, 0, 800, 900);
    ctx.fillStyle = "#e64a1e"; ctx.fillRect(0, 0, 800, 12);

    ctx.fillStyle = "#f0efec"; ctx.font = "700 46px Arial, sans-serif"; ctx.fillText("REP LOG", 60, 110);
    ctx.fillStyle = "#a7a9ae"; ctx.font = "700 20px Arial, sans-serif"; ctx.fillText("WEEKLY RECAP", 60, 145);
    ctx.fillStyle = "#74767c"; ctx.font = "16px Arial, sans-serif"; ctx.fillText(data.from + "   →   " + data.to, 60, 175);

    function stat(y, label, value, unit) {
      ctx.fillStyle = "#a7a9ae"; ctx.font = "700 16px Arial, sans-serif"; ctx.fillText(label.toUpperCase(), 60, y);
      ctx.fillStyle = "#f0efec"; ctx.font = "700 68px Arial, sans-serif"; ctx.fillText(value, 60, y + 82);
      if (unit) {
        var w = ctx.measureText(value).width;
        ctx.fillStyle = "#a7a9ae"; ctx.font = "600 24px Arial, sans-serif"; ctx.fillText(unit, 60 + w + 14, y + 82);
      }
    }
    stat(270, "Total volume", Math.round(data.volumeKg).toLocaleString(), "kg");
    stat(440, "Sessions", String(data.sessions), data.sessions === 1 ? "day" : "days");
    stat(610, "New PRs", String(data.prCount), data.prCount === 1 ? "lift" : "lifts");

    ctx.strokeStyle = "#34373d"; ctx.beginPath(); ctx.moveTo(60, 700); ctx.lineTo(740, 700); ctx.stroke();
    ctx.fillStyle = "#74767c"; ctx.font = "14px Arial, sans-serif"; ctx.fillText("Logged with Rep Log", 60, 740);

    canvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "rep-log-recap-" + todayISO() + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }, "image/png");
  }

  // ---------------------------------------------------------------
  // Rest timer
  // ---------------------------------------------------------------
  function startRestTimer() {
    clearInterval(restTimerHandle);
    state.rest.active = true;
    state.rest.remaining = state.rest.duration;
    restTimerHandle = setInterval(tickRest, 1000);
  }

  function stopRestTimer() {
    clearInterval(restTimerHandle);
    restTimerHandle = null;
    state.rest.active = false;
    state.rest.remaining = 0;
  }

  function tickRest() {
    state.rest.remaining--;
    if (state.rest.remaining <= 0) {
      clearInterval(restTimerHandle);
      restTimerHandle = null;
      state.rest.active = false;
      if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
      playBeep();
      render();
      return;
    }
    var timeEl = document.getElementById("rest-time");
    if (timeEl) {
      var mm = Math.floor(state.rest.remaining / 60), ss = state.rest.remaining % 60;
      timeEl.textContent = mm + ":" + String(ss).padStart(2, "0");
    } else {
      render();
    }
  }

  // ---------------------------------------------------------------
  // Workout session lifecycle
  // ---------------------------------------------------------------
  function selectExerciseForEntry(id) {
    var ex = exerciseById(id);
    if (!ex) return;
    if (!state.activeWorkout) {
      state.activeWorkout = { id: "w-" + uid(), date: todayISO(), startedAt: Date.now() };
      lsSetObj(LS_KEYS.activeWorkout, state.activeWorkout);
    }
    state.activeExercise = ex;
    state.draftSets = [];
    state.draftWeight = "";
    state.draftReps = "";
    state.draftNote = "";
    state.showNoteInput = false;
    state.showPlates = false;
    stopRestTimer();
    var last = state.allSets.filter(function (s) { return s.exerciseId === ex.id; })[0];
    if (last) { state.draftUnit = last.unit; state.draftWeight = String(last.weight); state.draftReps = String(last.reps); }
    render();
  }

  function finishWorkout() {
    var w = state.activeWorkout;
    if (!w) return;
    var wSets = setsForWorkout(w.id);
    if (!wSets.length) {
      state.activeWorkout = null;
      lsSetObj(LS_KEYS.activeWorkout, null);
      state.workoutView = "browse";
      render();
      return;
    }
    w.finishedAt = Date.now();
    state.workouts.push(w);
    lsSetArr(LS_KEYS.workouts, state.workouts);
    var elapsedMin = Math.max(1, Math.round((w.finishedAt - w.startedAt) / 60000));
    var totalVolume = wSets.reduce(function (sum, s) { return sum + (s.unit === "lb" ? s.weight * 0.453592 : s.weight) * s.reps; }, 0);
    var exCount = {};
    wSets.forEach(function (s) { exCount[s.exerciseId] = 1; });

    state.activeWorkout = null;
    lsSetObj(LS_KEYS.activeWorkout, null);
    state.workoutView = "browse";
    state.view = "history";
    render();
    toast(elapsedMin + " min · " + Object.keys(exCount).length + (Object.keys(exCount).length === 1 ? " exercise" : " exercises") + " · " + Math.round(totalVolume) + "kg volume");
  }

  function cancelWorkout() {
    var w = state.activeWorkout;
    if (!w) return;
    if (!confirm("Discard this workout and everything logged in it? This can’t be undone.")) return;
    state.allSets = state.allSets.filter(function (s) { return s.workoutId !== w.id; });
    lsSetArr(LS_KEYS.sets, state.allSets);
    state.activeWorkout = null;
    lsSetObj(LS_KEYS.activeWorkout, null);
    state.workoutView = "browse";
    state.activeExercise = null;
    render();
    toast("Workout discarded");
  }

  // ---------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------
  function wireEvents() {
    var app = document.getElementById("app");

    app.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.view = btn.getAttribute("data-tab");
        state.activeExercise = null;
        if (state.view === "log" && state.activeWorkout) state.workoutView = "workout";
        render();
      });
    });

    var menuBtn = document.getElementById("menu-btn");
    if (menuBtn) menuBtn.addEventListener("click", function () { state.menuOpen = true; render(); });
    var menuBackdrop = document.getElementById("menu-backdrop");
    if (menuBackdrop) menuBackdrop.addEventListener("click", function (e) {
      if (e.target === menuBackdrop) { state.menuOpen = false; render(); }
    });
    var exportBtn = document.getElementById("export-btn");
    if (exportBtn) exportBtn.addEventListener("click", exportBackup);
    var importBtn = document.getElementById("import-btn");
    if (importBtn) importBtn.addEventListener("click", function () {
      document.getElementById("import-file-input").click();
    });
    var clearBtn = document.getElementById("clear-btn");
    if (clearBtn) clearBtn.addEventListener("click", clearAllData);
    var signinBtn = document.getElementById("signin-btn");
    if (signinBtn) signinBtn.addEventListener("click", function () {
      if (!window.RepLogCloud) return;
      window.RepLogCloud.signIn().catch(function () { toast("Sign-in didn't complete"); });
    });
    var signoutBtn = document.getElementById("signout-btn");
    if (signoutBtn) signoutBtn.addEventListener("click", function () {
      if (window.RepLogCloud) window.RepLogCloud.signOutUser();
      state.menuOpen = false;
      render();
    });

    // Log: repeat / favorites / search / filters
    var repeatBtn = document.getElementById("repeat-btn");
    if (repeatBtn) repeatBtn.addEventListener("click", repeatLastWorkout);

    var searchInput = document.getElementById("ex-search");
    if (searchInput) {
      searchInput.addEventListener("input", function () {
        state.exerciseSearch = searchInput.value;
        var pos = searchInput.selectionStart;
        render();
        var el = document.getElementById("ex-search");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      });
    }
    app.querySelectorAll("[data-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.exerciseFilter = btn.getAttribute("data-filter");
        render();
      });
    });
    app.querySelectorAll("[data-equip]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.equipmentFilter = btn.getAttribute("data-equip");
        render();
      });
    });
    app.querySelectorAll("[data-toggle-fav]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-toggle-fav");
        var idx = state.favoriteIds.indexOf(id);
        if (idx === -1) state.favoriteIds.push(id); else state.favoriteIds.splice(idx, 1);
        lsSetArr(LS_KEYS.favorites, state.favoriteIds);
        render();
      });
    });
    app.querySelectorAll("[data-exercise]").forEach(function (btn) {
      btn.addEventListener("click", function () { selectExerciseForEntry(btn.getAttribute("data-exercise")); });
    });
    app.querySelectorAll("[data-resume-exercise]").forEach(function (btn) {
      btn.addEventListener("click", function () { selectExerciseForEntry(btn.getAttribute("data-resume-exercise")); });
    });
    var addExBtn = document.getElementById("add-ex-btn");
    if (addExBtn) addExBtn.addEventListener("click", promptAddCustomExercise);
    var addExerciseBtn = document.getElementById("add-exercise-btn");
    if (addExerciseBtn) addExerciseBtn.addEventListener("click", function () { state.workoutView = "browse"; render(); });
    var finishBtn = document.getElementById("finish-workout-btn");
    if (finishBtn) finishBtn.addEventListener("click", finishWorkout);
    var cancelWorkoutBtn = document.getElementById("cancel-workout-btn");
    if (cancelWorkoutBtn) cancelWorkoutBtn.addEventListener("click", cancelWorkout);
    var recapBtn = document.getElementById("recap-btn");
    if (recapBtn) recapBtn.addEventListener("click", downloadWeeklyRecap);

    // Log entry
    var backBtn = document.getElementById("log-back");
    if (backBtn) backBtn.addEventListener("click", function () {
      if (state.draftSets.length && !confirm("Discard sets you haven’t added?")) return;
      state.activeExercise = null;
      state.workoutView = "workout";
      stopRestTimer();
      render();
    });
    app.querySelectorAll("[data-unit]").forEach(function (btn) {
      btn.addEventListener("click", function () { state.draftUnit = btn.getAttribute("data-unit"); render(); });
    });
    app.querySelectorAll("[data-step]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var field = btn.getAttribute("data-step");
        var dir = parseInt(btn.getAttribute("data-dir"), 10);
        var stepVal = field === "weight" ? 2.5 : 1;
        var cur = parseFloat(field === "weight" ? state.draftWeight : state.draftReps) || 0;
        var next = Math.max(0, cur + dir * stepVal);
        if (field === "weight") state.draftWeight = String(next); else state.draftReps = String(next);
        render();
        var input = document.getElementById(field === "weight" ? "weight-input" : "reps-input");
        if (input) input.focus();
      });
    });
    var weightInput = document.getElementById("weight-input");
    if (weightInput) weightInput.addEventListener("input", function () { state.draftWeight = weightInput.value; });
    var repsInput = document.getElementById("reps-input");
    if (repsInput) repsInput.addEventListener("input", function () { state.draftReps = repsInput.value; });
    var plateToggle = document.getElementById("plate-toggle");
    if (plateToggle) plateToggle.addEventListener("click", function () { state.showPlates = !state.showPlates; render(); });
    var noteToggle = document.getElementById("note-toggle");
    if (noteToggle) noteToggle.addEventListener("click", function () { state.showNoteInput = !state.showNoteInput; render(); });
    var noteInput = document.getElementById("note-input");
    if (noteInput) noteInput.addEventListener("input", function () { state.draftNote = noteInput.value; });
    var suggestChip = document.getElementById("suggest-chip");
    if (suggestChip) suggestChip.addEventListener("click", function () {
      state.draftWeight = suggestChip.getAttribute("data-w");
      state.draftReps = suggestChip.getAttribute("data-r");
      render();
    });

    app.querySelectorAll("[data-rest-adj]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.rest.remaining = Math.max(0, state.rest.remaining + parseInt(btn.getAttribute("data-rest-adj"), 10));
        var timeEl = document.getElementById("rest-time");
        if (timeEl) {
          var mm = Math.floor(state.rest.remaining / 60), ss = state.rest.remaining % 60;
          timeEl.textContent = mm + ":" + String(ss).padStart(2, "0");
        }
      });
    });
    var restStop = document.querySelector("[data-rest-stop]");
    if (restStop) restStop.addEventListener("click", function () { stopRestTimer(); render(); });

    var addSetBtn = document.getElementById("add-set-btn");
    if (addSetBtn) addSetBtn.addEventListener("click", function () {
      var w = parseFloat(state.draftWeight);
      var r = parseInt(state.draftReps, 10);
      if (!(w >= 0) || !(r > 0)) { toast("Enter weight and reps"); return; }
      state.draftSets.push({ weight: w, unit: state.draftUnit, reps: r, note: state.draftNote.trim() });
      state.draftNote = "";
      state.showNoteInput = false;
      startRestTimer();
      render();
    });
    app.querySelectorAll("[data-remove-set]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.draftSets.splice(parseInt(btn.getAttribute("data-remove-set"), 10), 1);
        render();
      });
    });
    var saveBtn = document.getElementById("save-workout-btn");
    if (saveBtn) saveBtn.addEventListener("click", saveWorkout);

    app.querySelectorAll("[data-progress-ex]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.progressExerciseId = btn.getAttribute("data-progress-ex");
        render();
      });
    });

    // History: edit/delete
    app.querySelectorAll("[data-edit-set]").forEach(function (row) {
      row.addEventListener("click", function () {
        var id = row.getAttribute("data-edit-set");
        var s = state.allSets.filter(function (x) { return x.id === id; })[0];
        if (!s) return;
        state.editingSetId = id;
        state.editDraft = { weight: String(s.weight), reps: String(s.reps) };
        render();
      });
    });
    app.querySelectorAll("[data-delete-set]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-delete-set");
        if (!confirm("Delete this set?")) return;
        state.allSets = state.allSets.filter(function (s) { return s.id !== id; });
        lsSetArr(LS_KEYS.sets, state.allSets);
        render();
        toast("Set deleted");
      });
    });
    app.querySelectorAll("[data-edit-field]").forEach(function (inp) {
      inp.addEventListener("click", function (e) { e.stopPropagation(); });
      inp.addEventListener("input", function () { state.editDraft[inp.getAttribute("data-edit-field")] = inp.value; });
    });
    var saveEditBtn = app.querySelector("[data-save-edit]");
    if (saveEditBtn) saveEditBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var id = saveEditBtn.getAttribute("data-save-edit");
      var w = parseFloat(state.editDraft.weight), r = parseInt(state.editDraft.reps, 10);
      if (!(w >= 0) || !(r > 0)) { toast("Enter a valid weight and reps"); return; }
      var s = state.allSets.filter(function (x) { return x.id === id; })[0];
      if (s) { s.weight = w; s.reps = r; lsSetArr(LS_KEYS.sets, state.allSets); }
      state.editingSetId = null;
      render();
      toast("Set updated");
    });
    var cancelEditBtn = app.querySelector("[data-cancel-edit]");
    if (cancelEditBtn) cancelEditBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      state.editingSetId = null;
      render();
    });

    // Progress: bodyweight
    app.querySelectorAll("[data-bw-unit]").forEach(function (btn) {
      btn.addEventListener("click", function () { state.bwUnit = btn.getAttribute("data-bw-unit"); render(); });
    });
    var bwInput = document.getElementById("bw-input");
    if (bwInput) bwInput.addEventListener("input", function () { state.bwWeight = bwInput.value; });
    var logBwBtn = document.getElementById("log-bw-btn");
    if (logBwBtn) logBwBtn.addEventListener("click", logBodyweight);
  }

  function promptAddCustomExercise() {
    var name = prompt("Exercise name");
    if (!name || !name.trim()) return;
    var cat = prompt("Category: " + CATEGORIES.join(", "), "Chest");
    if (!cat || CATEGORIES.indexOf(cat) === -1) cat = "Chest";
    var eq = prompt("Equipment: " + EQUIPMENT.join(", "), "Barbell");
    if (!eq || EQUIPMENT.indexOf(eq) === -1) eq = "Barbell";
    var ex = { id: "c-" + uid(), name: name.trim(), category: cat, equipment: eq };
    state.customExercises.push(ex);
    lsSetArr(LS_KEYS.customExercises, state.customExercises);
    if (!storageOK) toast("Heads up: this browser won’t save data (private mode?)");
    if (state.user && window.RepLogCloud) window.RepLogCloud.saveCustomExercise(state.user.uid, ex).catch(function () {});
    selectExerciseForEntry(ex.id);
  }

  function logBodyweight() {
    var w = parseFloat(state.bwWeight);
    if (!(w > 0)) { toast("Enter your weight"); return; }
    var date = todayISO();
    var existing = state.bodyweights.filter(function (b) { return b.date === date; })[0];
    if (existing) { existing.weight = w; existing.unit = state.bwUnit; }
    else state.bodyweights.push({ id: "bw-" + uid(), date: date, weight: w, unit: state.bwUnit, createdAt: Date.now() });
    state.bodyweights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    lsSetArr(LS_KEYS.bodyweights, state.bodyweights);
    state.bwWeight = "";
    render();
    toast("Body weight logged");
  }

  function detectPRs(newSets, priorSets) {
    var bestPrior = {};
    priorSets.forEach(function (s) {
      var e = estForSet(s);
      if (bestPrior[s.exerciseId] === undefined || e > bestPrior[s.exerciseId]) bestPrior[s.exerciseId] = e;
    });
    var names = {};
    newSets.forEach(function (s) {
      var e = estForSet(s);
      var prior = bestPrior[s.exerciseId];
      if (prior !== undefined && e > prior + 0.001) {
        names[s.exerciseName] = true;
        bestPrior[s.exerciseId] = e;
      }
    });
    return Object.keys(names);
  }

  function commitSets(newSets) {
    var priorSets = state.allSets.slice();
    var prNames = detectPRs(newSets, priorSets);
    newSets.slice().reverse().forEach(function (s) { state.allSets.unshift(s); });
    state.allSets.sort(function (a, b) { return b.createdAt - a.createdAt; });
    lsSetArr(LS_KEYS.sets, state.allSets);
    if (state.user && window.RepLogCloud) window.RepLogCloud.saveSets(state.user.uid, newSets).catch(function () {});
    return prNames;
  }

  function saveWorkout() {
    if (!state.draftSets.length || state.saving) return;
    state.saving = true;
    var date = todayISO();
    var ts = Date.now();
    var ex = state.activeExercise;
    var workoutId = state.activeWorkout.id;
    var toSave = state.draftSets.map(function (s, i) {
      return { id: "s-" + uid(), workoutId: workoutId, exerciseId: ex.id, exerciseName: ex.name, weight: s.weight, unit: s.unit, reps: s.reps, note: s.note || "", date: date, createdAt: ts + i };
    });

    var prNames = commitSets(toSave);
    var savedCount = toSave.length;
    state.activeExercise = null;
    state.draftSets = [];
    state.showPlates = false;
    state.workoutView = "workout";
    state.saving = false;
    stopRestTimer();
    render();
    if (prNames.length) celebrate(prNames);
    else toast(savedCount + (savedCount === 1 ? " set" : " sets") + " added");
  }

  function repeatLastWorkout() {
    var groups = groupByDay(state.allSets);
    if (!groups.length) return;
    var g = groups[0];
    var date = todayISO();
    var ts = Date.now();
    var newWorkout = { id: "w-" + uid(), date: date, startedAt: ts, finishedAt: ts };
    var newSets = [];
    g.order.forEach(function (exId) {
      g.exercises[exId].sets.forEach(function (s) {
        newSets.push({ id: "s-" + uid(), workoutId: newWorkout.id, exerciseId: s.exerciseId, exerciseName: s.exerciseName, weight: s.weight, unit: s.unit, reps: s.reps, note: "", date: date, createdAt: ts + newSets.length });
      });
    });
    var prNames = commitSets(newSets);
    state.workouts.push(newWorkout);
    lsSetArr(LS_KEYS.workouts, state.workouts);
    state.view = "history";
    render();
    if (prNames.length) celebrate(prNames);
    else toast(newSets.length + (newSets.length === 1 ? " set" : " sets") + " repeated from " + fmtDateHeading(g.date));
  }

  function exportBackup() {
    var payload = {
      app: "rep-log",
      version: 2,
      exportedAt: new Date().toISOString(),
      sets: state.allSets,
      customExercises: state.customExercises,
      workouts: state.workouts,
      bodyweights: state.bodyweights,
      favoriteIds: state.favoriteIds
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "rep-log-backup-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    state.menuOpen = false;
    render();
    toast("Backup downloaded");
  }

  function clearAllData() {
    if (!confirm("Erase every logged set" + (state.user ? " from your account" : " on this device") + "? This can’t be undone (export a backup first if you want to keep it).")) return;
    state.allSets = [];
    state.customExercises = [];
    state.workouts = [];
    state.bodyweights = [];
    state.favoriteIds = [];
    state.activeWorkout = null;
    state.workoutView = "browse";
    lsSetArr(LS_KEYS.sets, []);
    lsSetArr(LS_KEYS.customExercises, []);
    lsSetArr(LS_KEYS.workouts, []);
    lsSetArr(LS_KEYS.bodyweights, []);
    lsSetArr(LS_KEYS.favorites, []);
    lsSetObj(LS_KEYS.activeWorkout, null);
    state.menuOpen = false;
    state.view = "log";
    render();
    toast("All data cleared");
  }

  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (e) {
        toast("That file isn’t valid backup JSON");
        return;
      }
      var incomingSets = Array.isArray(data.sets) ? data.sets : [];
      var incomingCustom = Array.isArray(data.customExercises) ? data.customExercises : [];
      var incomingWorkouts = Array.isArray(data.workouts) ? data.workouts : [];
      var incomingBw = Array.isArray(data.bodyweights) ? data.bodyweights : [];
      var incomingFavs = Array.isArray(data.favoriteIds) ? data.favoriteIds : [];
      if (!incomingSets.length && !incomingCustom.length) {
        toast("No sets found in that file");
        return;
      }

      var existingIds = {};
      state.allSets.forEach(function (s) { existingIds[s.id] = true; });
      var added = [];
      incomingSets.forEach(function (s) {
        if (s && s.id && !existingIds[s.id] && s.exerciseId && s.date) {
          state.allSets.push(s);
          existingIds[s.id] = true;
          added.push(s);
        }
      });
      state.allSets.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

      var existingExIds = {};
      state.customExercises.forEach(function (e) { existingExIds[e.id] = true; });
      incomingCustom.forEach(function (e) {
        if (e && e.id && !existingExIds[e.id]) { state.customExercises.push(e); existingExIds[e.id] = true; }
      });

      var existingWIds = {};
      state.workouts.forEach(function (w) { existingWIds[w.id] = true; });
      incomingWorkouts.forEach(function (w) {
        if (w && w.id && !existingWIds[w.id]) { state.workouts.push(w); existingWIds[w.id] = true; }
      });

      var existingBwIds = {};
      state.bodyweights.forEach(function (b) { existingBwIds[b.id] = true; });
      incomingBw.forEach(function (b) {
        if (b && b.id && !existingBwIds[b.id]) { state.bodyweights.push(b); existingBwIds[b.id] = true; }
      });
      state.bodyweights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      incomingFavs.forEach(function (id) { if (state.favoriteIds.indexOf(id) === -1) state.favoriteIds.push(id); });

      lsSetArr(LS_KEYS.sets, state.allSets);
      lsSetArr(LS_KEYS.customExercises, state.customExercises);
      lsSetArr(LS_KEYS.workouts, state.workouts);
      lsSetArr(LS_KEYS.bodyweights, state.bodyweights);
      lsSetArr(LS_KEYS.favorites, state.favoriteIds);
      if (state.user && window.RepLogCloud && added.length) window.RepLogCloud.saveSets(state.user.uid, added).catch(function () {});
      state.menuOpen = false;
      render();
      toast(added.length + (added.length === 1 ? " set" : " sets") + " imported");
    };
    reader.onerror = function () { toast("Couldn’t read that file"); };
    reader.readAsText(file);
  }

  // ---------------------------------------------------------------
  // Cloud sync
  // ---------------------------------------------------------------
  function setupCloud() {
    if (!window.RepLogCloud) { state.cloudAvailable = false; return; }
    state.cloudAvailable = true;
    window.RepLogCloud.onAuthChange(function (user) {
      if (user) {
        var justSignedIn = !state.user;
        state.user = { uid: user.uid, name: user.displayName || "You", photo: user.photoURL || "" };
        attachCloudListeners(user.uid, justSignedIn);
      } else {
        state.user = null;
        detachCloudListeners();
        state.allSets = lsGetArr(LS_KEYS.sets, []);
        state.customExercises = lsGetArr(LS_KEYS.customExercises, []);
      }
      render();
    });
  }

  function attachCloudListeners(uid, justSignedIn) {
    detachCloudListeners();
    if (justSignedIn) {
      var localSets = lsGetArr(LS_KEYS.sets, []);
      var localCustom = lsGetArr(LS_KEYS.customExercises, []);
      var migratedKey = "replog.migrated." + uid;
      if ((localSets.length || localCustom.length) && !lsGetFlag(migratedKey)) {
        window.RepLogCloud.migrateLocalData(uid, localSets, localCustom).then(function () {
          lsSetFlag(migratedKey);
        }).catch(function () {});
      }
    }
    unsubSets = window.RepLogCloud.watchSets(uid, function (sets) {
      if (sets) { state.allSets = sets; render(); }
    });
    unsubCustom = window.RepLogCloud.watchCustomExercises(uid, function (list) {
      if (list) { state.customExercises = list; render(); }
    });
  }

  function detachCloudListeners() {
    if (unsubSets) { unsubSets(); unsubSets = null; }
    if (unsubCustom) { unsubCustom(); unsubCustom = null; }
  }

  document.addEventListener("replog-cloud-ready", setupCloud);
  if (typeof window.RepLogCloud !== "undefined") setupCloud();

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  function boot() {
    state.allSets = lsGetArr(LS_KEYS.sets, []);
    state.customExercises = lsGetArr(LS_KEYS.customExercises, []);
    state.workouts = lsGetArr(LS_KEYS.workouts, []);
    state.bodyweights = lsGetArr(LS_KEYS.bodyweights, []);
    state.favoriteIds = lsGetArr(LS_KEYS.favorites, []);
    state.activeWorkout = lsGetObj(LS_KEYS.activeWorkout);
    if (state.activeWorkout) state.workoutView = "workout";
    render();
    if (!storageOK) toast("This browser is blocking storage — your data won’t be saved");

    var fileInput = document.getElementById("import-file-input");
    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) importBackupFile(fileInput.files[0]);
      fileInput.value = "";
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  }

  document.addEventListener("DOMContentLoaded", boot);
  if (document.readyState !== "loading") boot();
})();
</script>
</body>
</html>
